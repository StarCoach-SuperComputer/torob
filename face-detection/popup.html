<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تنظیمات دوربین و حریم خصوصی</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vazirmatn Persian Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Custom Checkbox checkmark styling */
    .custom-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 1.25rem;
      height: 1.25rem;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      border-radius: 0.35rem;
      background-color: transparent;
      cursor: pointer;
      display: inline-grid;
      place-content: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      flex-shrink: 0;
    }

    .custom-checkbox:hover {
      border-color: rgba(255, 255, 255, 0.7);
    }

    .custom-checkbox:checked {
      background-color: #ffffff;
      border-color: #ffffff;
    }

    .custom-checkbox::before {
      content: "";
      width: 0.65rem;
      height: 0.65rem;
      clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
      transform: scale(0);
      background-color: #1a222d;
      transition: 120ms transform ease-in-out;
    }

    .custom-checkbox:checked::before {
      transform: scale(1);
    }

    /* Modal Animation */
    @keyframes modalEntrance {
      from {
        opacity: 0;
        transform: scale(0.94) translateY(12px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-animate {
      animation: modalEntrance 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-[#0b0e14] text-[#f1f5f9] min-h-screen flex items-center justify-center p-3 sm:p-4 select-none relative overflow-hidden">

  <!-- Background Ambience to showcase backdrop blur -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden flex items-center justify-center">
    <div class="w-96 h-96 rounded-full bg-red-600/10 blur-[120px] -translate-x-32 -translate-y-24"></div>
    <div class="w-96 h-96 rounded-full bg-emerald-600/10 blur-[130px] translate-x-32 translate-y-24"></div>
  </div>

  <!-- Re-open trigger button (visible when modal is closed) -->
  <button id="reopenBtn" class="hidden z-10 bg-[#e53945] hover:bg-[#d02c38] text-white px-5 py-2.5 rounded-2xl text-sm font-semibold shadow-lg transition-all active:scale-95 flex items-center gap-2">
    <i data-lucide="shield-alert" class="w-4 h-4"></i>
    <span>نمایش پاپ‌آپ حریم خصوصی</span>
  </button>

  <!-- Modal Backdrop Overlay -->
  <div id="modalOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-md z-40 flex items-center justify-center p-3 sm:p-4 transition-opacity duration-200">
    
    <!-- Modal Card (Pixel-accurate matching the screenshot) -->
    <div id="modalCard" class="modal-animate w-full max-w-[460px] bg-[#1a222d] border border-[#2b3748] rounded-[28px] p-5 sm:p-6 shadow-[0_20px_50px_rgba(0,0,0,0.65)] text-right flex flex-col relative">
      
      <!-- Top Header Row -->
      <div class="flex items-center justify-between mb-4">
        <!-- Close Button (Left side in RTL) -->
        <button id="closeBtn" aria-label="بستن" class="w-9 h-9 rounded-xl bg-[#232d3c] hover:bg-[#2c3749] text-gray-400 hover:text-white transition-all flex items-center justify-center border border-[#303d50] active:scale-90">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>

        <!-- Title (Right side in RTL) -->
        <h2 class="text-lg sm:text-xl font-bold text-white tracking-normal">
          تنظیمات دوربین و حریم خصوصی
        </h2>
      </div>

      <!-- Main Body Privacy Description -->
      <div class="text-[13px] sm:text-[14px] text-gray-300/90 leading-[2.1] font-normal mb-5 text-justify">
        برای تجربه‌ی اختیاری دوربین، باید صریحاً اجازه بدهید. این پروتوتایپ فقط تصویر زنده را نمایش می‌دهد؛ <span class="font-bold text-white">هیچ تشخیص چهره یا احساس واقعی انجام نمی‌دهد</span> و تصویر را ذخیره نمی‌کند. دستیار برای فهمیدن رضایت یا تردید شما، سؤال مستقیم می‌پرسد.
      </div>

      <!-- Agreement Checkbox Inner Card -->
      <label class="bg-[#121923] border border-[#263344] hover:border-[#384a62] rounded-2xl p-4 mb-5 flex items-start gap-3.5 cursor-pointer transition-all duration-200 group">
        <!-- Text explanation inside box -->
        <span class="text-[12.5px] sm:text-[13.5px] text-gray-200 leading-[1.9] select-none flex-1">
          با فعال شدن دوربین و نمایش تصویر زنده در همین صفحه موافقم. می‌دانم که می‌توانم هر زمان آن را خاموش کنم.
        </span>

        <!-- Custom Checkbox (Right-hand in RTL) -->
        <div class="pt-1">
          <input type="checkbox" id="consentCheckbox" class="custom-checkbox">
        </div>
      </label>

      <!-- Action Buttons Row -->
      <div class="grid grid-cols-2 gap-3 pt-1">
        <!-- Secondary Button: Voice Assistant -->
        <button id="voiceBtn" class="bg-[#242f3e] hover:bg-[#2d3a4d] active:scale-95 text-gray-200 font-semibold py-3 px-3 rounded-2xl border border-[#344458] text-[13px] sm:text-[14px] transition-all flex items-center justify-center">
          ادامه با دستیار صوتی
        </button>

        <!-- Primary Action Button: Enable Camera -->
        <button id="activateCamBtn" class="bg-[#e53945] hover:bg-[#d42c38] active:scale-95 text-white font-semibold py-3 px-3 rounded-2xl shadow-lg shadow-red-900/30 text-[13px] sm:text-[14px] transition-all flex items-center justify-center">
          فعالسازی دوربین
        </button>
      </div>

      <!-- Toast Feedback Message Container -->
      <div id="toastMessage" class="hidden absolute -bottom-14 left-1/2 -translate-x-1/2 bg-gray-900/95 border border-gray-700 text-white text-xs px-4 py-2.5 rounded-xl shadow-xl transition-all whitespace-nowrap">
      </div>

    </div>
  </div>

  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // DOM Elements
    const modalOverlay = document.getElementById('modalOverlay');
    const reopenBtn = document.getElementById('reopenBtn');
    const closeBtn = document.getElementById('closeBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    const activateCamBtn = document.getElementById('activateCamBtn');
    const consentCheckbox = document.getElementById('consentCheckbox');
    const toastMessage = document.getElementById('toastMessage');

    // Show temporary toast feedback
    function showToast(text, isError = false) {
      toastMessage.textContent = text;
      toastMessage.className = `absolute -bottom-14 left-1/2 -translate-x-1/2 ${
        isError ? 'bg-red-950/95 border-red-500/50 text-red-200' : 'bg-emerald-950/95 border-emerald-500/50 text-emerald-200'
      } border text-xs px-4 py-2.5 rounded-xl shadow-xl transition-all z-50 whitespace-nowrap`;
      toastMessage.classList.remove('hidden');

      setTimeout(() => {
        toastMessage.classList.add('hidden');
      }, 2500);
    }

    // Modal close & open helpers
    function closeModal() {
      modalOverlay.classList.add('hidden');
      reopenBtn.classList.remove('hidden');
    }

    function openModal() {
      modalOverlay.classList.remove('hidden');
      reopenBtn.classList.add('hidden');
    }

    // Close button click
    closeBtn.addEventListener('click', closeModal);

    // Reopen button click
    reopenBtn.addEventListener('click', openModal);

    // Close on overlay backdrop tap (outside card)
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        closeModal();
      }
    });

    // Handle "ادامه با دستیار صوتی"
    voiceBtn.addEventListener('click', () => {
      showToast('حالت دستیار صوتی انتخاب شد');
      setTimeout(closeModal, 1000);
    });

    // Handle "فعالسازی دوربین"
    activateCamBtn.addEventListener('click', () => {
      if (!consentCheckbox.checked) {
        showToast('لطفاً تیک موافقت‌نامه را فعال کنید', true);
        consentCheckbox.focus();
        return;
      }

      showToast('دوربین با موفقیت فعال شد');
      setTimeout(closeModal, 1000);
    });
  </script>
</body>
</html>
